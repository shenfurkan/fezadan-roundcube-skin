<roundcube:include file="includes/layout.html" />

<div id="layout-content" class="selected no-navbar" role="main">
  <div class="fezadan-login">
    <span class="fezadan-brand"><span class="fezadan-logo" aria-hidden="true"></span><roundcube:object name="productname" /></span>
    <h1><roundcube:label name="fezadanloginheading" /></h1>
    <roundcube:form id="login-form" name="login-form" method="post" class="propform">
      <roundcube:object name="loginform" form="login-form" size="40" submit="false" class="form-control" />
      <roundcube:object name="plugin.fezadan_captcha" />
      <div class="formbuttons">
        <button type="submit" id="rcmloginsubmit" class="button mainaction submit" disabled aria-describedby="litecaptcha-status litecaptcha-detail"><roundcube:label name="login" /></button>
      </div>
      <div id="login-footer" role="contentinfo">
        <roundcube:if condition="config:support_url" />
          <a href="<roundcube:var name='config:support_url' />" target="_blank" rel="noopener" class="support-link"><roundcube:label name="support" /></a>
        <roundcube:endif />
        <roundcube:container name="loginfooter" id="login-footer" />
      </div>
    </form>
    <roundcube:object name="plugin.fezadan_login_extra" />
    <a class="fezadan-credit" href="https://fezadan.org" aria-label="Created by Fezadan" rel="noreferrer">
      <span class="fezadan-logo" aria-hidden="true"></span>
      <span class="fezadan-credit-text"><span>Created by</span><strong>Fezadan</strong></span>
    </a>
  </div>
</div>
<noscript><p class="noscriptwarning"><roundcube:label name="noscriptwarning" /></p></noscript>
<roundcube:include file="includes/footer.html" />
